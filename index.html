<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="register-box">

    <div class="logo">🎓</div>

    <h1>Student Portal</h1>
    <p class="subtitle">Create your student profile</p>

    <form id="studentForm">

        <div class="input-group">
            <label>Student Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
        </div>

        <div class="two-column">

            <div class="input-group">
                <label>Register Number</label>
                <input type="text" id="regno" placeholder="24ABC001" required>
            </div>

            <div class="input-group">
                <label>Department</label>
                <select id="department" required>
                    <option value="">Select</option>
                    <option>CSE</option>
                    <option>AI & DS</option>
                    <option>IT</option>
                    <option>ECE</option>
                    <option>EEE</option>
                </select>
            </div>

        </div>

        <div class="two-column">

            <div class="input-group">
                <label>Year</label>
                <select id="year" required>
                    <option value="">Select</option>
                    <option>1st Year</option>
                    <option>2nd Year</option>
                    <option>3rd Year</option>
                    <option>4th Year</option>
                </select>
            </div>

            <div class="input-group">
                <label>Phone</label>
                <input type="tel" id="phone" placeholder="9876543210" required>
            </div>

        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="student@gmail.com" required>
        </div>

        <button type="submit" class="main-btn">
            Enter Student Portal →
        </button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
